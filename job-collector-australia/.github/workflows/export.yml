# .github/workflows/export.yml
# ═══════════════════════════════════════════════════
# staged_jobs를 CSV로 내보내 GitHub Artifacts에 업로드
#
# 실행:
#   GitHub → Actions → "Export Jobs CSV" → Run workflow
# ═══════════════════════════════════════════════════

name: Export Jobs CSV

on:
  workflow_dispatch:
    inputs:
      days:
        description: "최근 며칠치 내보내기 (비워두면 전체)"
        required: false
        default: "7"

jobs:
  export:
    name: CSV 내보내기
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: CSV 내보내기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DAYS_ARG=""
          if [ -n "${{ github.event.inputs.days }}" ]; then
            DAYS_ARG="--days ${{ github.event.inputs.days }}"
          fi
          python scripts/export_csv.py $DAYS_ARG --out staged_jobs.csv

      - name: 수집 현황 출력
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/stats.py

      - name: CSV 업로드
        uses: actions/upload-artifact@v4
        with:
          name: staged-jobs-${{ github.run_id }}
          path: staged_jobs.csv
          retention-days: 30   # 30일간 보관
