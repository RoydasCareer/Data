<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">

    <!-- 지도 컨테이너 -->
    <div id="map-container"></div>

    <!-- 상단 네비게이션 -->
    <nav id="navbar">
      <div class="nav-brand">🗺️ 여행 지도</div>
      <div class="nav-actions">
        <button class="nav-btn" id="btn-toggle-sidebar">☰ 목록</button>
        <button class="nav-btn btn-accent" id="btn-add-place">📍 장소 추가</button>
        <button class="nav-btn btn-accent" id="btn-add-route">✈️ 경로 추가</button>
      </div>
    </nav>

    <!-- 오른쪽 사이드바 -->
    <aside id="sidebar" class="hidden">
      <div class="sidebar-header">
        <div class="sidebar-tabs">
          <button class="tab-btn active" data-tab="places">📍 장소</button>
          <button class="tab-btn" data-tab="routes">✈️ 경로</button>
          <button class="tab-btn" data-tab="stats">📊 통계</button>
        </div>
        <button id="btn-close-sidebar" class="btn-icon-only">✕</button>
      </div>

      <!-- 장소 탭 -->
      <div id="tab-places" class="tab-content active">
        <div class="tab-toolbar">
          <input type="search" id="place-search" placeholder="장소 검색...">
          <button class="btn-sm btn-primary" id="btn-add-place-2">+ 추가</button>
        </div>
        <div id="places-list" class="item-list">
          <div class="empty-state">📍 아직 방문한 장소가 없습니다.<br>장소를 추가해 보세요!</div>
        </div>
      </div>

      <!-- 경로 탭 -->
      <div id="tab-routes" class="tab-content">
        <div class="tab-toolbar">
          <span class="tab-title">이동 경로</span>
          <button class="btn-sm btn-primary" id="btn-add-route-2">+ 추가</button>
        </div>
        <div id="routes-list" class="item-list">
          <div class="empty-state">✈️ 아직 등록된 경로가 없습니다.</div>
        </div>
      </div>

      <!-- 통계 탭 -->
      <div id="tab-stats" class="tab-content">
        <div id="stats-panel" class="stats-panel">
          <div class="stat-card"><span class="stat-num" id="stat-places">0</span><span class="stat-label">방문 장소</span></div>
          <div class="stat-card"><span class="stat-num" id="stat-countries">0</span><span class="stat-label">방문 국가</span></div>
          <div class="stat-card"><span class="stat-num" id="stat-photos">0</span><span class="stat-label">사진</span></div>
          <div class="stat-card"><span class="stat-num" id="stat-routes">0</span><span class="stat-label">이동 경로</span></div>
        </div>
      </div>
    </aside>

    <!-- ===== 장소 추가/수정 모달 ===== -->
    <div id="modal-place" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-box">
        <div class="modal-header">
          <h2 id="modal-place-title">📍 장소 추가</h2>
          <button class="modal-close-btn" data-modal="place">✕</button>
        </div>
        <div class="modal-body">
          <form id="form-place" autocomplete="off">
            <input type="hidden" id="place-edit-id">
            <div class="form-group">
              <label>장소 검색 <span class="label-hint">이름으로 자동 완성</span></label>
              <div class="geocode-wrap">
                <input type="text" id="geocode-input" placeholder="예: 발라톤퓨레드, 방콕, 파리...">
                <div id="geocode-results" class="geocode-dropdown hidden"></div>
              </div>
            </div>
            <div class="form-group">
              <label for="place-name">장소명 *</label>
              <input type="text" id="place-name" required placeholder="예: 방콕 수완나품 공항">
            </div>
            <div class="form-group">
              <label for="place-country">국가</label>
              <input type="text" id="place-country" placeholder="예: 태국">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="place-lat">위도</label>
                <input type="number" id="place-lat" step="0.000001" placeholder="13.681100">
              </div>
              <div class="form-group">
                <label for="place-lng">경도</label>
                <input type="number" id="place-lng" step="0.000001" placeholder="100.747200">
              </div>
            </div>
            <div class="form-group">
              <label for="place-date">방문 날짜</label>
              <input type="date" id="place-date">
            </div>
            <div class="form-group">
              <label for="place-memo">메모</label>
              <textarea id="place-memo" rows="3" placeholder="여행 메모를 입력하세요..."></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-modal="place">취소</button>
          <button class="btn btn-primary" id="btn-save-place">저장</button>
        </div>
      </div>
    </div>

    <!-- ===== 경로 추가 모달 ===== -->
    <div id="modal-route" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-box">
        <div class="modal-header">
          <h2 id="modal-route-title">✈️ 경로 추가</h2>
          <button class="modal-close-btn" data-modal="route">✕</button>
        </div>
        <div class="modal-body">
          <form id="form-route" autocomplete="off">
            <input type="hidden" id="route-edit-id">
            <div class="form-group">
              <label>출발지 * <span class="label-hint">검색 후 목록에서 클릭</span></label>
              <div class="geocode-wrap">
                <input type="text" id="route-from-input" placeholder="한국어로 검색 (예: 파리, 도쿄, 발라톤퓨레드)..." autocomplete="off">
                <input type="hidden" id="route-from-id">
                <div id="route-from-results" class="geocode-dropdown hidden"></div>
              </div>
            </div>
            <div class="form-group">
              <label>도착지 * <span class="label-hint">검색 후 목록에서 클릭</span></label>
              <div class="geocode-wrap">
                <input type="text" id="route-to-input" placeholder="한국어로 검색 (예: 파리, 도쿄, 발라톤퓨레드)..." autocomplete="off">
                <input type="hidden" id="route-to-id">
                <div id="route-to-results" class="geocode-dropdown hidden"></div>
              </div>
            </div>
            <div class="form-group">
              <label for="route-transport">이동수단</label>
              <select id="route-transport">
                <option value="plane">✈️ 비행기</option>
                <option value="car">🚗 자동차</option>
                <option value="train">🚂 기차</option>
                <option value="bus">🚌 버스</option>
                <option value="ship">🚢 선박</option>
                <option value="bicycle">🚲 자전거</option>
                <option value="walk">🚶 도보</option>
              </select>
            </div>
            <div class="form-group">
              <label for="route-date">이동 날짜</label>
              <input type="date" id="route-date">
            </div>
            <div class="form-group">
              <label for="route-memo">메모 (항공사, 편명 등)</label>
              <input type="text" id="route-memo" placeholder="예: 비엣젯 VZ123">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-modal="route">취소</button>
          <button class="btn btn-primary" id="btn-save-route">저장</button>
        </div>
      </div>
    </div>

    <!-- ===== 사진 라이브러리 모달 ===== -->
    <div id="modal-photos" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-box modal-large">
        <div class="modal-header">
          <h2 id="modal-photos-title">📷 사진 라이브러리</h2>
          <button class="modal-close-btn" data-modal="photos">✕</button>
        </div>
        <div class="modal-body">
          <!-- 업로드 영역 -->
          <div class="upload-zone" id="upload-zone">
            <input type="file" id="photo-input" multiple accept="image/*" hidden>
            <div class="upload-hint">
              <div class="upload-icon">📸</div>
              <p>사진을 드래그하거나 클릭하여 업로드</p>
              <p class="upload-sub">EXIF GPS 정보가 있으면 자동으로 지역이 연결됩니다</p>
              <button class="btn btn-secondary" id="btn-select-photos">파일 선택</button>
            </div>
          </div>
          <!-- 사진 그리드 -->
          <div id="photo-grid" class="photo-grid"></div>
        </div>
      </div>
    </div>

    <!-- ===== 사진 뷰어 ===== -->
    <div id="photo-viewer" class="photo-viewer hidden">
      <div class="viewer-bg"></div>
      <button class="viewer-close">✕</button>
      <button class="viewer-nav viewer-prev" id="viewer-prev">&#8249;</button>
      <div class="viewer-center">
        <img id="viewer-img" src="" alt="사진">
        <div class="viewer-caption">
          <span id="viewer-counter"></span>
          <span id="viewer-info"></span>
        </div>
      </div>
      <button class="viewer-nav viewer-next" id="viewer-next">&#8250;</button>
      <div class="viewer-toolbar">
        <button class="btn btn-sm btn-danger" id="btn-delete-photo">🗑️ 삭제</button>
        <button class="btn btn-sm btn-secondary" id="btn-reassign-photo">📍 지역 변경</button>
      </div>
    </div>

    <!-- 지역 재지정 팝업 -->
    <div id="modal-reassign" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-box modal-small">
        <div class="modal-header">
          <h2>📍 지역 변경</h2>
          <button class="modal-close-btn" data-modal="reassign">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>지역 선택</label>
            <select id="reassign-place-select">
              <option value="">-- 미지정 --</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-modal="reassign">취소</button>
          <button class="btn btn-primary" id="btn-confirm-reassign">변경</button>
        </div>
      </div>
    </div>

    <!-- 로딩 오버레이 -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="loader"></div>
      <p>지도를 불러오는 중...</p>
    </div>

  </div><!-- #app -->

  <!-- CDN 라이브러리 -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/localforage@1.10.0/dist/localforage.min.js"></script>
  <script src="https://unpkg.com/exifr@7.1.3/dist/full.umd.cjs"></script>

  <!-- 앱 모듈 (순서 중요) -->
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/places.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/routes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
