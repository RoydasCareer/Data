<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 지구본 여행 기록</title>
  <!-- MapLibre GL CSS (head에 있어야 지도가 올바르게 렌더링됨) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 로딩 화면 -->
  <div id="loading">
    <div class="loading-inner">
      <div class="spinner"></div>
      <p>지도 불러오는 중…</p>
    </div>
  </div>

  <!-- 지도 컨테이너 (MapLibre GL JS) -->
  <div id="map"></div>

  <!-- 컨트롤 패널 -->
  <div id="control-panel">
    <div class="panel-header">
      <span class="logo">🌏</span>
      <h1>나의 여행 기록</h1>
    </div>

    <!-- 사진 업로드 -->
    <div class="panel-section">
      <h3>📸 사진 추가</h3>
      <label class="upload-btn" for="photo-input">
        <span>사진 선택 (EXIF 자동 위치 인식)</span>
        <input type="file" id="photo-input" multiple accept="image/*" hidden>
      </label>
    </div>

    <!-- 경로 추가 -->
    <div class="panel-section">
      <h3>🗺 이동 경로 추가</h3>

      <select id="transport-mode">
        <option value="plane">✈ 비행기</option>
        <option value="ship">⛵ 배/선박</option>
        <option value="car">🚗 자동차</option>
        <option value="train">🚆 기차</option>
        <option value="walk">🚶 도보</option>
      </select>

      <!-- 항공사 검색 (비행기 선택 시에만 표시) -->
      <div class="search-group" id="airline-group">
        <label class="search-label">항공사 (선택사항)</label>
        <input type="text" id="airline-search"
               placeholder="항공사 검색... 예) 대한항공, ANA" autocomplete="off">
        <div id="airline-results" class="search-results hidden"></div>
        <div id="airline-badge" class="selected-badge hidden"></div>
      </div>

      <!-- 출발지 검색 -->
      <div class="search-group">
        <label class="search-label">출발지</label>
        <input type="text" id="origin-search"
               placeholder="검색... 예) 인천공항, 서울역" autocomplete="off">
        <div id="origin-results" class="search-results hidden"></div>
        <div id="origin-badge" class="selected-badge hidden"></div>
      </div>

      <!-- 도착지 검색 -->
      <div class="search-group">
        <label class="search-label">도착지</label>
        <input type="text" id="dest-search"
               placeholder="검색... 예) 발라톤퓨레드, 방콕" autocomplete="off">
        <div id="dest-results" class="search-results hidden"></div>
        <div id="dest-badge" class="selected-badge hidden"></div>
      </div>

      <button id="add-route-btn" class="btn-primary">경로 추가</button>
    </div>

    <!-- 통계 -->
    <div class="panel-section stats-section">
      <div class="stat-item">
        <span class="stat-num" id="visit-count">0</span>
        <span class="stat-label">방문 지역</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-num" id="photo-count">0</span>
        <span class="stat-label">사진</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-num" id="route-count">0</span>
        <span class="stat-label">이동 경로</span>
      </div>
    </div>

    <!-- 경로 목록 -->
    <div class="panel-section">
      <h3>📋 경로 목록</h3>
      <div id="route-list"><p class="list-empty">경로가 없습니다.</p></div>
    </div>

    <!-- 임베드 -->
    <div class="panel-section">
      <h3>🔗 블로그 임베드</h3>
      <button id="copy-embed-btn" class="btn-secondary">임베드 코드 복사</button>
    </div>
  </div>

  <!-- 사진 갤러리 모달 -->
  <div id="photo-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modal-close" aria-label="닫기">&times;</button>
      <div class="modal-header">
        <h2 id="modal-location-name">—</h2>
        <p id="modal-photo-count"></p>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </div>

  <!-- 전체화면 이미지 뷰어 -->
  <div id="fullscreen-viewer" class="fullscreen hidden" role="dialog" aria-modal="true">
    <button class="fs-btn fs-close" id="fs-close">&times;</button>
    <button class="fs-btn fs-prev" id="fs-prev">&#8249;</button>
    <button class="fs-btn fs-next" id="fs-next">&#8250;</button>
    <div class="fs-counter" id="fs-counter"></div>
    <img id="fs-img" src="" alt="여행 사진">
  </div>

  <!-- 수동 위치 지정 모달 (EXIF 없는 사진) -->
  <div id="manual-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-small">
      <h2>📍 위치 직접 지정</h2>
      <p class="manual-filename" id="manual-filename"></p>
      <p class="manual-hint">EXIF 위치 정보가 없어요. 장소를 검색해 지정해주세요.</p>
      <div class="search-group">
        <input type="text" id="manual-search"
               placeholder="장소 검색... 예) 강남구, 홍대입구역" autocomplete="off">
        <div id="manual-results" class="search-results hidden"></div>
      </div>
      <div class="modal-actions">
        <button id="manual-confirm" class="btn-primary">이 위치로 지정</button>
        <button id="manual-skip" class="btn-secondary">건너뛰기</button>
      </div>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div id="edit-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" id="edit-backdrop"></div>
    <div class="modal-content modal-small">
      <button class="modal-close" id="edit-close-btn">&times;</button>
      <h2 id="edit-title">수정</h2>

      <!-- 위치 전용 섹션 (경로 수정 시 숨김) -->
      <div id="edit-loc-section">
        <div class="search-group">
          <label class="search-label">새 위치 검색 (선택사항)</label>
          <input type="text" id="edit-loc-search"
                 placeholder="장소 검색... 예) 런던, 파리" autocomplete="off">
          <div id="edit-loc-results" class="search-results hidden"></div>
          <div id="edit-loc-badge" class="selected-badge hidden"></div>
        </div>
        <label class="upload-btn" for="edit-photo-input" style="margin-bottom:10px">
          <span>📸 사진 추가</span>
          <input type="file" id="edit-photo-input" multiple accept="image/*" hidden>
        </label>
      </div>

      <label class="search-label" style="display:block;margin-bottom:4px">이름</label>
      <input type="text" id="edit-name" placeholder="이름 입력">
      <div class="modal-actions">
        <button id="edit-confirm" class="btn-primary">저장</button>
        <button id="edit-cancel" class="btn-secondary">취소</button>
      </div>
    </div>
  </div>

  <!-- 라이브러리 (body 하단) -->
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.cjs"></script>
  <script src="app.js"></script>
</body>
</html>
